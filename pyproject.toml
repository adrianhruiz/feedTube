[project]
name = "feedtube"
version = "0.1.0"
description = "Follow YouTube channels and download their uploads with yt-dlp from a terminal UI"
readme = "README.md"
authors = [
    { name = "adrianhruiz", email = "groveh8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
feedtube = "feedtube:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
